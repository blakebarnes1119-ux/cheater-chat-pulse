<title>Chat Glitch Pulse // meetthecheater</title>
<!--
  Chat Glitch Pulse - Lightstream browser source (single file, no dependencies).
  Draws the chat frame (magenta cut-corner border, teal brackets, side ticks, "CHAT // ENCRYPTED")
  on a transparent page and fires a glitch pulse for every Twitch chat message (anonymous IRC).

  URL params
    ?channel=name    Twitch channel to watch (default: meetthecheater)
    ?test=1          fake pulse every 2.5 s (preview without chat)
    ?w=&h=           output size in px (default 1920x1080; layout scales to it)
    ?frameonly=1     page is exactly the frame (348x512 by default) and the frame fills it
    ?pad=N           frameonly only: add N px of transparent margin around the frame (room for brackets/ticks/codes)
    ?fx=&fy=&fw=&fh= override the frame rect in 1920x1080 layout units (default 1552,548,348,512, the v3-wide overlay)
    ?cut=N           corner cut size in layout px (default 18)
    ?border=hex      border colour (default B03CC8, the overlay's magenta); accent stays FF2BD6
    ?codes=0         disable the cheat-code static
    ?fps=N           cap the frame rate (default 60)
    ?debug=1         show connection status + counters in the top-left corner
-->

function unescapeTag(v){
  return v.replace(/\\(.)/g,function(_,c){return c===':'?';':c==='s'?' ':c==='\\'?'\\':c==='r'?'\r':c==='n'?'\n':c;}).replace(/\\$/,'');

function parseIrcLine(line){
  var msg={raw:line,tags:{},prefix:null,nick:null,command:'',params:[]};
  if(!line) return null;

    var bang=msg.prefix.indexOf('!'); msg.nick=bang>=0?msg.prefix.slice(0,bang):msg.prefix;
  }
  while(line.charAt(i)===' ') i++;

  if(ti>=0){head=rest.slice(0,ti); trailing=rest.slice(ti+2);}
  var parts=head.split(' ').filter(Boolean);
  msg.command=(parts.shift()||'').toUpperCase();
  msg.params=parts; if(trailing!==null) msg.params.push(trailing);

}
function sanitizeChannel(c){ c=String(c||'').trim().toLowerCase().replace(/^#/,'').replace(/[^a-z0-9_]/g,''); return c||'meetthecheater'; }

function TwitchAnonChat(opts){
  var self=this;

    self.send('PASS SCHMOOPIIE');
    self.send('NICK '+self.nick);
    self.send('JOIN #'+self.channel);

  var self=this; self._stopKeepalive();

function drawLabel(c,alpha){
  var LS=num('ls',0.958);
  c.font='700 '+(13*LS).toFixed(2)+'px CPLabel, "Chakra Petch", "Rajdhani", "Segoe UI", sans-serif'; c.textBaseline='top';
  var track=3*LS, wsum=0, ws=[]; for(var i=0;i<LABEL.length;i++){var w=c.measureText(LABEL[i]).width; ws.push(w); wsum+=w+track;} wsum-=track;
  var x=F.x+F.w-4-wsum, y=F.y+F.h+4;
  c.fillStyle=TEAL; c.globalAlpha=alpha;
  for(var j=0;j<LABEL.length;j++){ c.fillText(LABEL[j],x,y); x+=ws[j]+track; }
  c.globalAlpha=1; return F.x+F.w-4-wsum;
}

// ---------------- cheat-code static ----------------
var CODE_LIST=['↑↑↓↓←→←→BA','UP UP DOWN DOWN LEFT RIGHT LEFT RIGHT B A','IDDQD','IDKFA','NOCLIP','GOD MODE','sv_cheats 1','fly','god','ROSEBUD','HESOYAM',
               'IDCLIP','noclip','BAGUVIX','AEZAKMI','impulse 101','↑↑↓↓←→←→ B A START'];
var CODE_OP=0.82, CODE_DUR=0.92, CODE_HOLD=0.6, CODE_MIN=5, CODE_MAX=8, CODE_SMIN=12, CODE_SMAX=16;
var fragCache=new Map();
function tint(mask,col){ var c=document.createElement('canvas'); c.width=mask.width; c.height=mask.height; var x=c.getContext('2d'); x.drawImage(mask,0,0); x.globalCompositeOperation='source-in'; x.fillStyle=col; x.fillRect(0,0,c.width,c.height); return c; }
function buildFrag(txt,size,edge){
  var key=txt+'|'+size+'|'+edge; if(fragCache.has(key)) return fragCache.get(key);
  var k=KY, font='700 '+(size*k)+'px CPMono, "DejaVu Sans Mono", Consolas, monospace';
  var m=document.createElement('canvas').getContext('2d'); m.font=font;
  var tw=Math.ceil(m.measureText(txt).width)+2, th=Math.ceil(size*k*1.25);
  var vert=(edge==='left'||edge==='right');
  var mk=document.createElement('canvas'); mk.width=vert?th:tw; mk.height=vert?tw:th; var x=mk.getContext('2d');
  x.font=font; x.textBaseline='middle'; x.fillStyle='#fff';
  if(vert){ x.translate(th/2,tw/2); x.rotate(edge==='left'?-Math.PI/2:Math.PI/2); x.fillText(txt,-tw/2+1,0); }
  else x.fillText(txt,1,th/2);
  // torn variant: 3px strips across the reading direction, shifted along it
  var tn=document.createElement('canvas'); tn.width=mk.width; tn.height=mk.height; var y=tn.getContext('2d');
  var r=mulberry(key.length*7919+size*131+edge.length), st=Math.max(2,Math.round(3*k));
  if(vert){ for(var c0=0;c0<mk.width;c0+=st){ y.drawImage(mk,c0,0,st,mk.height,c0,Math.round((r()*6-3)*k),st,mk.height); } }
  else { for(var r0=0;r0<mk.height;r0+=st){ y.drawImage(mk,0,r0,mk.width,st,Math.round((r()*6-3)*k),r0,mk.width,st); } }
  var f={vert:vert,w:mk.width/KX,h:mk.height/KY,
    n:{core:tint(mk,CODECORE),acc:tint(mk,PMAG),teal:tint(mk,PCYAN),deep:tint(mk,DEEP)},
    t:{core:tint(tn,CODECORE),acc:tint(tn,PMAG),teal:tint(tn,PCYAN),deep:tint(tn,DEEP)}};
  fragCache.set(key,f); return f;
}
function planCodes(seed){
  var r=mulberry(seed), edges=['left','top','bottom','right'];
  for(var i=edges.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=edges[i];edges[i]=edges[j];edges[j]=t;}
  var n=CODE_MIN+Math.floor(r()*(CODE_MAX-CODE_MIN+1)), used={}, picks=[], perEdge={left:[],top:[],bottom:[],right:[]};
  for(var q=0;q<n;q++){
    var txt, tries=0; do{ txt=CODE_LIST[Math.floor(r()*CODE_LIST.length)]; }while(used[txt]&&++tries<50); used[txt]=1;
    perEdge[edges[q%4]].push(txt);
  }
  var out=[];
  edges.forEach(function(edge){
    var list=perEdge[edge], k=list.length; if(!k) return;
    list.forEach(function(txt,idx){
      var size=CODE_SMIN+Math.floor(r()*(CODE_SMAX-CODE_SMIN+1)), f=buildFrag(txt,size,edge), x, y, inset=r()<0.35?(1+r()*4):0;
      var gap=TIGHT?-1:0;
      if(f.vert){
        var a0=F.y+30, a1=F.y+F.h-30, sl=(a1-a0)/k, s0=a0+sl*idx, span=sl-f.h;
        y=span>0?s0+r()*span:Math.max(a0,Math.min(a1-f.h,s0+(sl-f.h)/2));
        x=edge==='left'?(F.x-4-f.w+inset-gap*(f.w-3)):(F.x+F.w+4-inset+gap*(f.w-3));
      }else{
        var b0=F.x+30, b1=F.x+F.w-(edge==='bottom'&&!TIGHT?225:30), sw=(b1-b0)/k, x0=b0+sw*idx, sp=sw-f.w;
        x=sp>0?x0+r()*sp:Math.max(b0-10,Math.min(b1-f.w,x0+(sw-f.w)/2));
        y=edge==='top'?(F.y-f.h-1+inset-gap*(f.h-3)):(F.y+F.h+3-inset+gap*(f.h-3));
      }
      out.push({f:f,x:x,y:y,edge:edge,ph:r()*0.08,seed:Math.floor(r()*1e9)});
    });
  });
  return out;
}
function drawCodes(c,p,u,step){
  if(u<0||u>=CODE_DUR) return;
  c.imageSmoothingEnabled=false;
  for(var i=0;i<p.codes.length;i++){
    var g=p.codes[i], uu=u-g.ph; if(uu<0) continue;
    var r=mulberry(g.seed^(step*2654435761));
    var tail=u<CODE_HOLD?1:1-Math.pow((u-CODE_HOLD)/(CODE_DUR-CODE_HOLD),2);
    var v=Math.min(1,uu/0.03)*tail;
    if(r()<0.2) continue;                          // flicker off
    v*=0.75+0.25*r();
    var set=r()<0.5?g.f.t:g.f.n, op=CODE_OP*v, f=g.f;
    var jx=f.vert?0:Math.round(r()*6-3), jy=f.vert?Math.round(r()*6-3):0;
    var x=g.x+jx, y=g.y+jy, rs=2+r()*2;
    var len=f.vert?f.h:f.w, g0=-1, gl=0; if(r()<0.45){ g0=r()*Math.max(1,len-10); gl=3+r()*8; }
    var layers=[[set.deep,1,1,Math.min(1,op*1.1)],[set.acc,rs,0,op*0.85],[set.teal,-rs,0,op*0.75],[set.core,0,0,op]];
    if(f.vert){ layers[1][1]=0; layers[1][2]=rs; layers[2][1]=0; layers[2][2]=-rs; }
    for(var L=0;L<layers.length;L++){
      var im=layers[L][0], dx=layers[L][1], dy=layers[L][2]; c.globalAlpha=layers[L][3];
      if(g0<0){ c.drawImage(im,x+dx,y+dy,f.w,f.h); continue; }
      var kk=f.vert?KY:KX, a0=Math.floor(g0*kk), a1=Math.ceil((g0+gl)*kk), tot=f.vert?im.height:im.width;
      if(f.vert){ if(a0>0) c.drawImage(im,0,0,im.width,a0,x+dx,y+dy,f.w,a0/KY); if(a1<tot) c.drawImage(im,0,a1,im.width,tot-a1,x+dx,y+dy+a1/KY,f.w,(tot-a1)/KY); }
      else { if(a0>0) c.drawImage(im,0,0,a0,im.height,x+dx,y+dy,a0/KX,f.h); if(a1<tot) c.drawImage(im,a1,0,tot-a1,im.height,x+dx+a1/KX,y+dy,(tot-a1)/KX,f.h); }
    }
  }
  c.globalAlpha=1; c.imageSmoothingEnabled=true;
}

// ---------------- pulses: queue / merge, max ~3 starts per second ----------------
// Envelope (~1.0 s): hard attack (0-60 ms) -> flickering hold (to 450 ms) -> decay (to 1000 ms).
// A message arriving mid-pulse starts a new pulse (re-attack); overlapping pulses combine by max.
var PULSE_DUR=1.0, ATTACK=0.06, HOLD_END=0.45, MIN_GAP=340, MAX_PENDING=3;
var pulses=[], pending=0, lastFire=-1e9, pulseCount=0, msgCount=0, mergedCount=0;
function onChat(){ msgCount++; if(pending>=MAX_PENDING) mergedCount++; pending=Math.min(MAX_PENDING,pending+1); }
function firePulse(nowMs){
  var seed=(Math.random()*4294967296)>>>0;
  pulses.push({t0:nowMs/1000,seed:seed,spark:mulberry(seed)(),codes:CODES?planCodes(seed):[]});
  lastFire=nowMs; pulseCount++;
}
function pumpQueue(nowMs){ if(pending>0&&nowMs-lastFire>=MIN_GAP){ pending--; firePulse(nowMs); } }
function eout(x){x=Math.max(0,Math.min(1,x)); return 1-Math.pow(1-x,3);}
function pulseEnv(u,flick){            // flick: 0..1 random per 33 ms step
  if(u<0||u>=PULSE_DUR) return 0;
  if(u<ATTACK) return eout(u/ATTACK);
  if(u<HOLD_END) return flick<0.12?0.45:0.78+0.22*flick;          // strobe-y hold
  var p=(u-HOLD_END)/(PULSE_DUR-HOLD_END); return 0.85*Math.pow(1-p,1.6)*(0.85+0.15*flick);
}
function popEnv(u){                     // scale pop: snap out, ease back
  if(u<0||u>=PULSE_DUR) return 0;
  if(u<0.05) return eout(u/0.05);
  return Math.exp(-(u-0.05)/0.14);
}

// ---------------- render ----------------
function render(nowMs){
  var t=nowMs/1000, step=Math.floor(nowMs/33);
  pulses=pulses.filter(function(p){return t-p.t0<PULSE_DUR+0.05;});
  var e=0, ep=null, pop=0;
  for(var i=0;i<pulses.length;i++){ var u=t-pulses[i].t0, fr=mulberry(pulses[i].seed^(step*97531))();
    var b=pulseEnv(u,fr); if(b>e){e=b;ep=pulses[i];} pop=Math.max(pop,popEnv(u)); }
  var c=lx; c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,lay.width,lay.height);
  c.setTransform(KX,0,0,KY,-LR.x*KX,-LR.y*KY); c.lineJoin='miter'; c.lineCap='butt';
  var r=ep?mulberry(ep.seed^(step*40503)):null;
  // deep shadow under the border on pulse
  if(e>0.01){ pathPoly(c,PTS,4,3); c.strokeStyle=DEEP; c.globalAlpha=0.9*e; c.lineWidth=4+2*e; c.stroke(); c.globalAlpha=1; }
  // base border with shimmer; thicker + hotter during pulse
  var shim=0.85+0.1*Math.sin(2*Math.PI*t/2)+0.05*Math.sin(2*Math.PI*t*15/16);
  pathPoly(c,PTS); glowStroke(c,e>0.3?PMAG:MAG,Math.min(1,shim*(1+0.6*e)),2+2*e,0.7+1.6*e);
  // teal corner brackets
  var bx0=F.x-BRK,by0=F.y-BRK,bx1=F.x+F.w+BRK,by1=F.y+F.h+BRK,BL=30;
  c.beginPath(); [[bx0,by0,1,1],[bx1,by0,-1,1],[bx1,by1,-1,-1],[bx0,by1,1,-1]].forEach(function(q){seg(c,q[0],q[1],q[0]+q[2]*BL,q[1]);seg(c,q[0],q[1],q[0],q[1]+q[3]*BL);});
  glowStroke(c,e>0.3?PCYAN:TEAL,0.7+0.3*per(t,4,0.5)+0.3*e,2+e,0.6+1.0*e);
  // running light around the border
  var head=t/(16/3), n=28, len=0.10;
  for(var k=0;k<n;k++){ var p0=perimPoint(head-len*k/n), p1=perimPoint(head-len*(k+1)/n);
    c.beginPath(); c.moveTo(p0[0],p0[1]); c.lineTo(p1[0],p1[1]); glowStroke(c,TRAIL,0.7*Math.pow(1-k/n,1.5),2,1.0); }
  if(!TIGHT){
    c.beginPath(); for(var y=F.y+40,kk=0;y<F.y+F.h-40;y+=22,kk++){ seg(c,F.x+F.w+10,y+0.5,F.x+F.w+(kk%3===0?16:13),y+0.5); }
    c.strokeStyle=e>0.3?PCYAN:TEAL; c.globalAlpha=0.4+0.5*e; c.lineWidth=1; c.stroke(); c.globalAlpha=1;
    var lxp=drawLabel(c,0.8+0.2*e);
    c.beginPath(); c.arc(lxp-10,F.y+F.h+10,3,0,Math.PI*2); c.fillStyle=HOT;
    var da=0.4+0.6*Math.max(e,0.3*per(t,2)); c.globalAlpha=da*0.25; c.fill(); c.beginPath(); c.arc(lxp-10,F.y+F.h+10,2.2,0,Math.PI*2); c.globalAlpha=da; c.fill(); c.globalAlpha=1;
  }
  if(e>0.01){
    // wide RGB split of the border: cyan left/up, magenta right/down, glowing
    var sp=3+6*e*(0.6+0.4*r()), vy=(r()-0.5)*3*e;
    c.globalCompositeOperation='lighter';
    pathPoly(c,PTS,-sp,-vy); glowStroke(c,PCYAN,0.95*e,2+1.5*e,1.2*e);
    pathPoly(c,PTS,sp,vy);  glowStroke(c,PMAG,1.0*e,2+1.5*e,1.2*e);
    // brightness flash (strongest on attack)
    pathPoly(c,PTS); glowStroke(c,WHITE,0.6*e*e,2+e,1.0);
    c.globalCompositeOperation='source-over';
    // magenta spark (two on strong pulses)
    for(var sk=0;sk<(e>0.6?2:1);sk++){
      var su=(ep.spark+sk*0.47)%1, sn=14;
      for(var s=0;s<sn;s++){ var a0=perimPoint(su-0.07*s/sn), a1=perimPoint(su-0.07*(s+1)/sn); c.beginPath(); c.moveTo(a0[0],a0[1]); c.lineTo(a1[0],a1[1]); glowStroke(c,s<2?WHITE:PMAG,e*Math.pow(1-s/sn,1.1),3.5,1.6); }
      var hp=perimPoint(su); c.beginPath(); c.arc(hp[0],hp[1],5+5*e,0,Math.PI*2); c.fillStyle=PMAG; c.globalAlpha=0.35*e; c.fill(); c.globalAlpha=1;
    }
  }
  for(var pi=0;pi<pulses.length;pi++) drawCodes(c,pulses[pi],t-pulses[pi].t0,step);
  c.setTransform(1,0,0,1,0,0);

  // ---- compose layer -> page: scale pop about the frame centre + screen shake + slice jitter ----
  var m=ctx; m.setTransform(1,0,0,1,0,0); m.clearRect(0,0,cv.width,cv.height);
  var sc=1+POP_SCALE*pop, shx=0, shy=0;
  if(e>0.01){ var sr=mulberry((ep.seed+0x51ed)^(step*374761393)); shx=(sr()*2-1)*SHAKE*e; shy=(sr()*2-1)*SHAKE*e; }
  var cx=(F.x+F.w/2)*KX, cy=(F.y+F.h/2)*KY;
  m.setTransform(sc,0,0,sc,cx-sc*cx+shx*KX,cy-sc*cy+shy*KY);
  if(e>0.01){
    var rr=mulberry((ep.seed+0x9e37)^(step*2246822519)), y0=0, shiftMax=10*Math.min(1,e*1.3)*KX;
    while(y0<lay.height){
      var hgt=Math.min(lay.height-y0,Math.round((6+rr()*36)*KY)), dx=0;
      if(rr()<0.35) dx=Math.round((rr()*2-1)*shiftMax);
      m.drawImage(lay,0,y0,lay.width,hgt,LPX+dx,LPY+y0,lay.width,hgt);
      y0+=hgt;
    }
    m.globalCompositeOperation='lighter'; m.globalAlpha=0.22*e; m.drawImage(lay,LPX,LPY); m.globalAlpha=1; m.globalCompositeOperation='source-over';
  }else m.drawImage(lay,LPX,LPY);
  // HARD GUARANTEE: erase the chat interior (inset 3 px, untransformed) AFTER pop/shake
  m.setTransform(KX,0,0,KY,0,0); m.globalCompositeOperation='destination-out'; pathPoly(m,INNER); m.fillStyle='#000'; m.fill();
  m.globalCompositeOperation='source-over'; m.setTransform(1,0,0,1,0,0);
}

// ---------------- loop ----------------
var running=true, lastDraw=0, frameMs=1000/FPS;
function loop(ts){
  if(!running) return;
  requestAnimationFrame(loop);
  var now=performance.now();
  pumpQueue(now);
  if(now-lastDraw<frameMs-1) return;
  lastDraw=now; render(now);
}

// ---------------- debug / status ----------------
var dbg=document.getElementById('dbg'), status='init', chat=null;
if(DEBUG) dbg.style.display='block';
function updDbg(){ if(!DEBUG) return; dbg.textContent='#'+CHANNEL+'  '+status+'\nmsgs '+msgCount+'  pulses '+pulseCount+'  merged '+mergedCount+(TEST?'\nTEST MODE':''); }
setInterval(updDbg,250);

// ---------------- start ----------------
function start(){
  requestAnimationFrame(loop);
  if(TEST){ setTimeout(onChat,600); setInterval(onChat,2500); }
  if(typeof WebSocket!=='undefined'){
    chat=new TwitchAnonChat({channel:CHANNEL,WebSocket:WebSocket,onPrivmsg:function(){onChat();},
      onStatus:function(s,x){status=s+(x!==undefined?' '+x:''); if(DEBUG) console.log('[chatpulse]',status);}});
    chat.connect();
  }
}
var fontsReady=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('700 13px CPLabel'),document.fonts.load('700 11px CPMono','↑IDQ')]).catch(function(){}):Promise.resolve();
Promise.race([fontsReady,new Promise(function(r){setTimeout(r,1500);})]).then(start);

// hooks for testing/preview (harmless in production)
window.__chatpulse={
  get stats(){return {channel:CHANNEL,status:status,messages:msgCount,pulses:pulseCount,merged:mergedCount,pending:pending,irc:chat?chat.stats:null};},
  chat:function(){onChat();},
  stop:function(){running=false;},
  start:function(){if(!running){running=true;requestAnimationFrame(loop);}},
  renderAt:function(ms){render(ms);},
  firePulseAt:function(ms,seed){firePulse(ms); if(seed!==undefined){var p=pulses[pulses.length-1]; p.seed=seed>>>0; p.spark=mulberry(p.seed)(); p.codes=CODES?planCodes(p.seed):[];}},
  geometry:{F:F,INNER:INNER,out:[OUT_W,OUT_H],layout:[LW,LH]}
};
})();
